# Hooks run through uv so they use exactly the versions pinned in backend/uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix .
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
      - id: mypy
        name: mypy
        entry: uv run --directory backend mypy .
        language: system
        pass_filenames: false
        files: ^backend/.*\.py$
