name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskbridge
          POSTGRES_PASSWORD: taskbridge
          POSTGRES_DB: taskbridge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskbridge"
          --health-interval 3s
          --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-retries 20

    env:
      DJANGO_SECRET_KEY: ci-only
      DATABASE_URL: postgres://taskbridge:taskbridge@localhost:5432/taskbridge
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest
