x-backend: &backend
  build: ./backend
  volumes:
    - ./backend:/app
  env_file:
    - path: .env
      required: false
  environment:
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-insecure-change-me}
    DJANGO_DEBUG: "true"
    DATABASE_URL: postgres://taskbridge:taskbridge@postgres:5432/taskbridge
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: taskbridge
      POSTGRES_PASSWORD: taskbridge
      POSTGRES_DB: taskbridge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskbridge"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    <<: *backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    # -B embeds the beat scheduler; fine for a single worker, split it out before scaling.
    command: celery -A taskbridge worker -B --loglevel=info

volumes:
  pgdata:
