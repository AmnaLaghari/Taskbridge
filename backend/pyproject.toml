[project]
name = "taskbridge"
version = "0.1.0"
description = "Bidirectional sync between GitHub Issues and Todoist"
readme = "../README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "djangorestframework>=3.16",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.5",
    "redis>=5.2",
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "respx>=0.22",
    "ruff>=0.12",
    "mypy>=1.16",
    "django-stubs[compatible-mypy]>=5.2",
    "djangorestframework-stubs>=3.16",
    "pre-commit>=4.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "DJ", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Django's Meta options are class-level lists by design; RUF012 would have us
# annotate every one of them with ClassVar for no benefit.
"**/models.py" = ["RUF012"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ModelAdmin and TabularInline are generic to django-stubs but not subscriptable at
# runtime, so admin classes cannot name their model. Everything else stays strict.
module = ["sync.admin"]
disallow_any_generics = false

[[tool.mypy.overrides]]
# Celery ships no type information, so @shared_task is an untyped decorator and
# everything it wraps is treated as untyped. Confined to this module, which holds
# nothing but thin task wrappers; the logic they call is checked normally.
module = ["sync.tasks"]
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "taskbridge.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "taskbridge.settings"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
